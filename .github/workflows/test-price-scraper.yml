name: Test price scraper access

on:
  workflow_dispatch: {}

jobs:
  test-scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install scraper library
        run: pip install il-supermarket-scraper

      - name: Try downloading one Rami Levi price file
        run: python scripts/test_scraper.py
