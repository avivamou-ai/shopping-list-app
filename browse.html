<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>קטלוג חנות</title>
  <meta name="theme-color" content="#2c7a4b">
  <link rel="manifest" href="static/manifest.json">
  <link rel="apple-touch-icon" href="static/icon.svg">
  <link rel="icon" href="static/icon.svg">
  <link rel="stylesheet" href="static/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div id="login-screen" class="login-screen">
    <form id="login-form" class="login-form">
      <h1>קטלוג חנות</h1>
      <input type="email" id="login-email" placeholder="אימייל" required autocomplete="email">
      <input type="password" id="login-password" placeholder="סיסמה" required autocomplete="current-password">
      <button type="submit">התחבר</button>
      <p id="login-error" class="login-error"></p>
    </form>
  </div>

  <div id="app-screen" hidden>
    <header class="topbar">
      <h1>קטלוג חנות</h1>
      <div class="header-actions">
        <a class="link-btn" href="search.html">חיפוש</a>
        <a class="link-btn" href="catalog.html">קטלוג אישי</a>
        <a class="link-btn" href="index.html">רשימה</a>
        <button id="logout-btn" class="link-btn">התנתק</button>
      </div>
    </header>
    <main>
      <form id="browse-form" class="add-form">
        <select id="browse-store"></select>
        <button type="submit">📋 הצג קטלוג</button>
      </form>
      <div id="browse-summary" class="empty"></div>
      <div id="browse-results"></div>
      <div id="browse-pager" class="pager"></div>
    </main>
  </div>

  <script src="static/supabase-client.js"></script>
  <script src="static/constants.js"></script>
  <script src="static/auth.js"></script>
  <script src="static/browse.js"></script>
</body>
</html>
